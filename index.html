  <title>One Guide</title>
  <style>
    :root {
      color-scheme: dark;
      --bg: #081a2a;
      --text: rgba(255,255,255,.96);
      --muted: rgba(255,255,255,.56);
      --hairline: rgba(255,255,255,.14);
      --glass: rgba(255,255,255,.09);
      --glass-strong: rgba(255,255,255,.16);
      --shadow: 0 22px 64px rgba(0, 10, 24, .28);
      --green: #34c759;
      --orange: #ff9f0a;
      --yellow: #ffd60a;
      --red: #ff453a;
      --gray: #8e8e93;
      --blue: #0a84ff;
      --radius: 26px;
    }

    * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
    html, body { min-height: 100%; margin: 0; background: transparent; }
    body {
      font-family: -apple-system, BlinkMacSystemFont, "SF Pro Display", "SF Pro Text", "Helvetica Neue", Arial, sans-serif;
      color: var(--text);
      overflow-x: hidden;
      position: relative;
    }

    body::before,
    body::after {
      content: "";
      position: fixed;
      z-index: -3;
      border-radius: 50%;
      filter: blur(80px);
      pointer-events: none;
      opacity: 0;
    }
    body::before {
      width: 340px;
      height: 340px;
      top: -110px;
      left: -85px;
      background: radial-gradient(circle, rgba(255, 211, 137, .62), rgba(255, 211, 137, 0) 72%);
    }
    body::after {
      width: 420px;
      height: 420px;
      right: -180px;
      top: 18%;
      background: radial-gradient(circle, rgba(80, 200, 255, .28), rgba(80, 200, 255, 0) 72%);
    }

    .ocean-bg {
      position: fixed;
      inset: 0;
      z-index: 0;
      overflow: hidden;
      pointer-events: none;
      background: #7fd5fb;
    }

    .ocean-world {
      position: absolute;
      inset: -4%;
      transform-origin: 50% 54%;
      transform: translate3d(0,0,0) scale(1);
      transition: transform 1.45s cubic-bezier(.2,.86,.22,1), filter 1.1s ease;
      will-change: transform;
    }

    .ocean-world svg {
      width: 100%;
      height: 100%;
      display: block;
    }

    .ocean-shimmer {
      position: absolute;
      left: -12%;
      width: 124%;
      height: 12%;
      top: 47%;
      opacity: .42;
      background:
        radial-gradient(ellipse at 12% 45%, rgba(255,255,255,.72) 0 1.5%, transparent 1.8%),
        radial-gradient(ellipse at 34% 60%, rgba(255,255,255,.5) 0 1.1%, transparent 1.5%),
        radial-gradient(ellipse at 56% 38%, rgba(255,255,255,.66) 0 1.4%, transparent 1.8%),
        radial-gradient(ellipse at 78% 58%, rgba(255,255,255,.5) 0 1.2%, transparent 1.6%),
        radial-gradient(ellipse at 92% 34%, rgba(255,255,255,.65) 0 1.3%, transparent 1.7%);
      background-size: 220px 90px;
      animation: seaSparkle 9s linear infinite;
      filter: blur(.35px);
    }

    .water-veil {
      position: absolute;
      inset: 0;
      opacity: 0;
      background:
        linear-gradient(180deg, rgba(36,165,213,0) 0%, rgba(24,143,194,.05) 18%, rgba(3,91,142,.28) 64%, rgba(4,57,99,.46) 100%),
        radial-gradient(ellipse at 50% -8%, rgba(255,255,255,.28), rgba(255,255,255,0) 43%);
      transition: opacity 1.05s ease .18s;
      backdrop-filter: saturate(112%);
      -webkit-backdrop-filter: saturate(112%);
    }

    .under-ripples {
      position: absolute;
      inset: 0;
      opacity: 0;
      transition: opacity .85s ease .45s;
      background:
        repeating-radial-gradient(ellipse at 50% -12%, rgba(255,255,255,.08) 0 2px, transparent 3px 24px);
      mask-image: linear-gradient(180deg, rgba(0,0,0,.75), rgba(0,0,0,.08) 70%, transparent);
      -webkit-mask-image: linear-gradient(180deg, rgba(0,0,0,.75), rgba(0,0,0,.08) 70%, transparent);
      transform: scale(1.25);
      animation: rippleBreath 7s ease-in-out infinite alternate;
    }

    body.detail-mode .ocean-world {
      /* Same beach scene: the camera simply travels toward the water. */
      transform: translate3d(0, -8%, 0) scale(1.72);
      filter: saturate(1.08) brightness(.92);
    }
    body.detail-mode .water-veil { opacity: 1; }
    body.detail-mode .under-ripples { opacity: .78; }

    @keyframes waveSlide {
      from { transform: translateX(0); }
      to { transform: translateX(-110px); }
    }
    @keyframes waveSlideReverse {
      from { transform: translateX(-120px); }
      to { transform: translateX(0); }
    }
    @keyframes palmSway {
      0%,100% { transform: rotate(-1.2deg); }
      50% { transform: rotate(1.5deg); }
    }
    @keyframes seaSparkle {
      from { transform: translateX(0); }
      to { transform: translateX(-180px); }
    }
    @keyframes rippleBreath {
      from { transform: scale(1.18) translateY(-1%); }
      to { transform: scale(1.32) translateY(1.5%); }
    }

    .wave-back { animation: waveSlide 15s linear infinite; }
    .wave-front { animation: waveSlideReverse 10s linear infinite; }
    .palm-group { transform-origin: 130px 1170px; animation: palmSway 7s ease-in-out infinite; }

    .app {
      position: relative;
      z-index: 3;
      width: min(100%, 520px);
      margin: 0 auto;
      min-height: 100svh;
      padding: calc(env(safe-area-inset-top) + 10px) 14px calc(env(safe-area-inset-bottom) + 96px);
    }

    .glass {
      background: linear-gradient(180deg, rgba(255,255,255,.18), rgba(255,255,255,.055));
      border: 1px solid rgba(255,255,255,.14);
      box-shadow: inset 0 1px 0 rgba(255,255,255,.22), inset 0 -1px 0 rgba(255,255,255,.03), 0 18px 46px rgba(2, 16, 31, .26);
      backdrop-filter: blur(24px) saturate(165%);
      -webkit-backdrop-filter: blur(24px) saturate(165%);
    }

    .topbar {
      position: sticky;
      overflow: hidden;
      top: calc(env(safe-area-inset-top) + 8px);
      z-index: 30;
      height: 60px;
      border-radius: 22px;
      padding: 8px 10px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      margin-bottom: 12px;
    }

    .brand {
      display: flex;
      align-items: center;
      gap: 10px;
      min-width: 0;
    }

    .logo-wrap {
      width: 38px;
      height: 38px;
      display: grid;
      place-items: center;
      background: transparent;
      border: 0;
      box-shadow: none;
      overflow: visible;
      position: relative;
    }
    .logo-wrap::before,
    .logo-wrap::after { content: none; }
    .logo-wrap img {
      width: 38px;
      height: 38px;
      object-fit: contain;
      display: block;
      filter: drop-shadow(0 6px 10px rgba(0,0,0,.14));
    }
    .brand-name { font-size: 20px; line-height: 1; font-weight: 760; letter-spacing: -.52px; text-shadow: 0 1px 0 rgba(255,255,255,.14); }

    .icon-button {
      width: 42px;
      height: 42px;
      border: 0;
      border-radius: 14px;
      background: rgba(255,255,255,.075);
      color: rgba(255,255,255,.92);
      display: grid;
      place-items: center;
      padding: 0;
      cursor: pointer;
    }
    .icon-button:active { transform: scale(.96); background: rgba(255,255,255,.13); }
    .icon-button svg { width: 21px; height: 21px; }

    .legend {
      display: flex;
      position: relative;
      gap: 7px;
      overflow-x: auto;
      scrollbar-width: none;
      padding: 1px 1px 10px;
      margin: 0 0 2px;
    }
    .legend::-webkit-scrollbar { display: none; }

    .chip {
      flex: 0 0 auto;
      backdrop-filter: blur(20px) saturate(150%);
      -webkit-backdrop-filter: blur(20px) saturate(150%);
      display: inline-flex;
      align-items: center;
      gap: 6px;
      min-height: 30px;
      padding: 0 10px;
      border-radius: 999px;
      background: rgba(255,255,255,.055);
      border: 1px solid rgba(255,255,255,.085);
      color: rgba(255,255,255,.76);
      font-size: 11px;
      font-weight: 700;
      letter-spacing: .02em;
    }
    .dot { width: 7px; height: 7px; border-radius: 50%; background: var(--c); box-shadow: 0 0 12px color-mix(in srgb, var(--c) 58%, transparent); }

    .current-card {
      display: none;
      width: 100%;
      min-height: 78px;
      border-radius: 24px;
      margin: 2px 0 12px;
      padding: 13px 14px;
      align-items: center;
      gap: 12px;
      cursor: pointer;
    }
    .current-card.show { display: flex; }
    .current-eye {
      width: 42px; height: 42px; flex: 0 0 auto; border-radius: 50%;
      display: grid; place-items: center;
      background: rgba(10,132,255,.16);
      border: 1px solid rgba(10,132,255,.26);
      color: #79baff;
    }
    .current-eye svg { width: 21px; height: 21px; }
    .current-main { min-width: 0; flex: 1; }
    .current-top { display:flex; align-items:center; gap:8px; min-width:0; }
    .current-number { font-size: 20px; font-weight: 760; letter-spacing: -.45px; }
    .current-status { font-size: 11px; font-weight: 800; letter-spacing: .03em; color: var(--status); }
    .current-sub { margin-top: 3px; font-size: 12px; color: var(--muted); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
    .chevron { width:18px; height:18px; opacity:.5; flex:0 0 auto; }

    .block-list { display: grid; grid-template-columns: 1fr; gap: 9px; }

    .block-card {
      width: 100%;
      background: linear-gradient(180deg, rgba(255,255,255,.12), rgba(255,255,255,.038));
      border: 0;
      border-radius: 22px;
      padding: 14px 14px 12px;
      text-align: left;
      color: inherit;
      cursor: pointer;
      position: relative;
      overflow: hidden;
    }
    .block-card:active { transform: scale(.988); }
    .block-head { display:flex; align-items:flex-start; gap:12px; }
    .block-copy { flex:1; min-width:0; }
    .block-name { font-size: 16px; font-weight: 680; letter-spacing: -.2px; line-height:1.18; }
    .block-meta { margin-top:5px; font-size: 11px; color: var(--muted); font-weight: 600; }
    .block-now {
      display:none;
      align-items:center;
      gap:5px;
      font-size:10px;
      font-weight:800;
      color:#79baff;
      background:rgba(10,132,255,.14);
      border:1px solid rgba(10,132,255,.19);
      border-radius:999px;
      padding:5px 8px;
      white-space:nowrap;
    }
    .block-card.is-current .block-now { display:inline-flex; }
    .block-now svg { width:12px; height:12px; }
    .status-strip { display:flex; gap:2px; height:5px; margin-top:12px; border-radius:999px; overflow:hidden; }
    .status-strip span { min-width:1px; flex:1; background:var(--c); opacity:.9; }

    .detail-view { display:none; }
    .detail-view.show { display:block; animation:fadeIn .18s ease; }
    .home-view.hide { display:none; }
    @keyframes fadeIn { from {opacity:0; transform:translateY(5px)} to {opacity:1; transform:none} }

    .detail-head {
      position: sticky;
      top: calc(env(safe-area-inset-top) + 80px);
      z-index: 22;
      border-radius: 24px;
      padding: 10px;
      margin-bottom: 10px;
      display:flex;
      align-items:center;
      gap:10px;
    }
    .back-button { flex:0 0 auto; }
    .detail-title-wrap { min-width:0; flex:1; }
    .detail-title { font-size:17px; font-weight:720; letter-spacing:-.25px; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
    .detail-range { margin-top:3px; font-size:11px; color:var(--muted); font-weight:600; }

    .episode-list { display:grid; gap:7px; }
    .episode-row {
      position:relative;
      min-height: 62px;
      border-radius: 20px;
      padding: 9px 9px 9px 13px;
      display:flex;
      align-items:center;
      gap:10px;
      cursor:pointer;
      background:linear-gradient(180deg, rgba(255,255,255,.08), rgba(255,255,255,.045));
      border:1px solid rgba(255,255,255,.075);
      backdrop-filter: blur(18px) saturate(150%);
      -webkit-backdrop-filter: blur(18px) saturate(150%);
    }
    .episode-row::before {
      content:"";
      position:absolute;
      left:0;
      top:12px;
      bottom:12px;
      width:3px;
      border-radius:0 999px 999px 0;
      background:var(--status);
    }
    .episode-row.is-current {
      background:linear-gradient(180deg, rgba(10,132,255,.16), rgba(10,132,255,.075));
      border-color:rgba(10,132,255,.28);
      box-shadow:0 0 0 1px rgba(10,132,255,.06) inset;
    }
    .episode-copy { min-width:0; flex:1; }
    .episode-line { display:flex; align-items:baseline; gap:8px; }
    .episode-local { font-size:15px; font-weight:680; letter-spacing:-.15px; }
    .episode-global { font-size:11px; color:var(--muted); font-weight:650; }
    .episode-status { margin-top:4px; font-size:10px; font-weight:840; letter-spacing:.045em; color:var(--status); }

    .eye-button {
      width:42px;
      height:42px;
      flex:0 0 auto;
      border:0;
      border-radius:14px;
      padding:0;
      color:rgba(255,255,255,.52);
      background:rgba(255,255,255,.055);
      display:grid;
      place-items:center;
      cursor:pointer;
    }
    .eye-button svg { width:20px; height:20px; }
    .eye-button.active { color:#8bc5ff; background:rgba(10,132,255,.16); }
    .eye-button:active { transform:scale(.95); }

    .current-dock {
      z-index: 35 !important;
      position:fixed;
      z-index:40;
      left:50%;
      bottom:calc(env(safe-area-inset-bottom) + 14px);
      transform:translateX(-50%) translateY(120px);
      width:min(calc(100% - 28px), 492px);
      min-height:60px;
      border-radius:23px;
      padding:8px 10px;
      display:flex;
      align-items:center;
      gap:10px;
      transition:transform .28s cubic-bezier(.2,.8,.2,1), opacity .2s ease;
      opacity:0;
      cursor:pointer;
    }
    .current-dock.show { transform:translateX(-50%) translateY(0); opacity:1; }
    .dock-icon { width:40px; height:40px; border-radius:14px; display:grid; place-items:center; background:rgba(10,132,255,.15); color:#83c0ff; }
    .dock-icon svg { width:20px; height:20px; }
    .dock-copy { flex:1; min-width:0; }
    .dock-title { font-size:14px; font-weight:730; letter-spacing:-.1px; }
    .dock-sub { margin-top:2px; font-size:11px; color:var(--muted); white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
    .dock-status { font-size:10px; font-weight:850; color:var(--status); letter-spacing:.04em; }

    .sheet-backdrop {
      z-index: 80 !important;
      position:fixed;
      inset:0;
      z-index:70;
      background:rgba(0,0,0,.34);
      opacity:0;
      pointer-events:none;
      transition:opacity .2s ease;
      backdrop-filter:blur(3px);
      -webkit-backdrop-filter:blur(3px);
    }
    .sheet-backdrop.show { opacity:1; pointer-events:auto; }
    .sheet {
      position:absolute;
      left:50%;
      bottom:calc(env(safe-area-inset-bottom) + 10px);
      transform:translate(-50%, 28px);
      width:min(calc(100% - 20px), 500px);
      border-radius:30px;
      padding:20px;
      opacity:0;
      transition:transform .22s cubic-bezier(.2,.8,.2,1), opacity .18s ease;
    }
    .sheet-backdrop.show .sheet { transform:translate(-50%, 0); opacity:1; }
    .sheet-grabber { width:40px; height:5px; border-radius:999px; background:rgba(255,255,255,.18); margin:-7px auto 16px; }
    .sheet-number { font-size:12px; color:var(--muted); font-weight:700; }
    .sheet-status { margin-top:6px; font-size:22px; font-weight:780; letter-spacing:-.45px; color:var(--status); }
    .sheet-text { margin-top:10px; font-size:14px; line-height:1.42; color:rgba(255,255,255,.74); }

    .toast {
      position:fixed;
      z-index:90;
      top:calc(env(safe-area-inset-top) + 84px);
      left:50%;
      transform:translate(-50%, -12px);
      max-width:calc(100% - 32px);
      padding:10px 14px;
      border-radius:999px;
      background:rgba(26,26,30,.82);
      border:1px solid rgba(255,255,255,.11);
      backdrop-filter:blur(22px) saturate(160%);
      -webkit-backdrop-filter:blur(22px) saturate(160%);
      font-size:12px;
      font-weight:700;
      color:rgba(255,255,255,.88);
      opacity:0;
      pointer-events:none;
      transition:opacity .18s ease, transform .18s ease;
      white-space:nowrap;
    }
    .toast.show { opacity:1; transform:translate(-50%, 0); }


    .block-name, .detail-title, .current-number, .brand-name { text-shadow: 0 1px 8px rgba(0,20,40,.22); }

    body.detail-mode .glass {
      background: linear-gradient(180deg, rgba(255,255,255,.18), rgba(255,255,255,.065));
      border-color: rgba(255,255,255,.16);
    }
    body.detail-mode .detail-view {
      position: relative;
      z-index: 4;
    }

    @media (min-width: 470px) {
      .block-list { grid-template-columns: 1fr 1fr; }
    }

    @media (prefers-reduced-motion: reduce) {
      *, *::before, *::after { scroll-behavior:auto !important; transition:none !important; animation:none !important; }
    }

    /* ===== APARIENCIA REAL: DÍA / NOCHE / AUTOMÁTICO ===== */

    .sun-glow-svg,
    .sun-core-svg {
      transition: opacity 1s ease, transform 1.1s ease;
      transform-origin: 180px 240px;
    }

    .night-layer {
      position: absolute;
      inset: 0;
      z-index: 2;
      opacity: 0;
      pointer-events: none;
      overflow: hidden;
      transition: opacity 1.05s ease;
      background:
        linear-gradient(180deg,
          rgba(2, 8, 24, .88) 0%,
          rgba(6, 20, 43, .80) 25%,
          rgba(7, 38, 67, .66) 43%,
          rgba(4, 38, 65, .38) 58%,
          rgba(2, 18, 36, .60) 100%);
    }

    .night-stars {
      position: absolute;
      inset: 0 0 43% 0;
      opacity: .96;
      background-image:
        radial-gradient(circle at 5% 12%, rgba(255,255,255,.95) 0 1.1px, transparent 1.8px),
        radial-gradient(circle at 13% 27%, rgba(225,240,255,.80) 0 1px, transparent 1.6px),
        radial-gradient(circle at 20% 7%, rgba(255,255,255,.78) 0 1px, transparent 1.6px),
        radial-gradient(circle at 28% 20%, rgba(255,255,255,.96) 0 1.2px, transparent 1.9px),
        radial-gradient(circle at 35% 34%, rgba(225,240,255,.72) 0 1px, transparent 1.6px),
        radial-gradient(circle at 43% 10%, rgba(255,255,255,.90) 0 1.2px, transparent 1.8px),
        radial-gradient(circle at 52% 27%, rgba(255,255,255,.80) 0 1px, transparent 1.6px),
        radial-gradient(circle at 59% 14%, rgba(234,246,255,.94) 0 1.2px, transparent 1.8px),
        radial-gradient(circle at 67% 33%, rgba(255,255,255,.84) 0 1px, transparent 1.6px),
        radial-gradient(circle at 74% 8%, rgba(255,255,255,.97) 0 1.2px, transparent 1.9px),
        radial-gradient(circle at 81% 23%, rgba(228,243,255,.82) 0 1px, transparent 1.6px),
        radial-gradient(circle at 90% 13%, rgba(255,255,255,.94) 0 1.2px, transparent 1.8px),
        radial-gradient(circle at 96% 34%, rgba(255,255,255,.72) 0 1px, transparent 1.6px),
        radial-gradient(circle at 11% 43%, rgba(255,255,255,.76) 0 1px, transparent 1.6px),
        radial-gradient(circle at 31% 47%, rgba(255,255,255,.88) 0 1.1px, transparent 1.7px),
        radial-gradient(circle at 49% 43%, rgba(222,239,255,.72) 0 1px, transparent 1.6px),
        radial-gradient(circle at 70% 48%, rgba(255,255,255,.88) 0 1.1px, transparent 1.7px),
        radial-gradient(circle at 87% 44%, rgba(255,255,255,.76) 0 1px, transparent 1.6px);
      filter: drop-shadow(0 0 3px rgba(190,220,255,.35));
      animation: nightTwinkle 5.5s ease-in-out infinite alternate;
    }

    .night-moon {
      position: absolute;
      top: max(7%, calc(env(safe-area-inset-top) + 46px));
      right: 10%;
      width: 86px;
      height: 86px;
      border-radius: 50%;
      transform: translateY(12px) scale(.92);
      background:
        radial-gradient(circle at 32% 32%, rgba(166,184,205,.22) 0 6px, transparent 7px),
        radial-gradient(circle at 66% 58%, rgba(158,179,202,.20) 0 8px, transparent 9px),
        radial-gradient(circle at 46% 76%, rgba(172,190,211,.18) 0 5px, transparent 6px),
        radial-gradient(circle, #fff 0 53%, #edf5ff 65%, #c9dcf4 76%, rgba(201,220,244,0) 77%);
      box-shadow:
        0 0 26px rgba(213,233,255,.62),
        0 0 68px rgba(143,196,255,.30);
      transition: transform 1.1s cubic-bezier(.22,1,.36,1);
    }

    .moon-reflection {
      position: absolute;
      top: 40%;
      right: 7%;
      width: 115px;
      height: 29%;
      opacity: .46;
      transform: perspective(120px) rotateX(57deg);
      transform-origin: 50% 0;
      background:
        repeating-linear-gradient(
          180deg,
          rgba(220,240,255,.48) 0 3px,
          rgba(220,240,255,0) 4px 11px
        );
      filter: blur(2px);
      mask-image: linear-gradient(180deg, rgba(0,0,0,.9), transparent);
      -webkit-mask-image: linear-gradient(180deg, rgba(0,0,0,.9), transparent);
    }

    body.night-theme .night-layer { opacity: 1; }

    body.night-theme .sun-glow-svg,
    body.night-theme .sun-core-svg {
      opacity: 0 !important;
      transform: translateY(-24px) scale(.88);
    }

    body.night-theme .ocean-world {
      filter: brightness(.64) saturate(.78) contrast(1.05);
    }

    body.night-theme.detail-mode .ocean-world {
      transform: translate3d(0, -8%, 0) scale(1.72);
      filter: brightness(.54) saturate(.78) contrast(1.06);
    }

    body.night-theme .ocean-shimmer {
      opacity: .16;
      filter: blur(.8px);
    }

    body.night-theme .glass {
      background: linear-gradient(180deg, rgba(24,44,69,.34), rgba(7,23,42,.20));
      border-color: rgba(202,225,248,.15);
      box-shadow:
        inset 0 1px 0 rgba(225,239,255,.13),
        inset 0 -1px 0 rgba(255,255,255,.025),
        0 18px 46px rgba(0,7,18,.34);
    }

    body.night-theme .block-card {
      background: linear-gradient(180deg, rgba(33,58,84,.27), rgba(8,27,48,.16));
    }

    body.night-theme .water-veil {
      background:
        linear-gradient(180deg, rgba(8,32,56,0) 0%, rgba(7,44,71,.08) 18%, rgba(2,38,67,.38) 64%, rgba(1,21,42,.62) 100%),
        radial-gradient(ellipse at 50% -8%, rgba(148,202,246,.12), rgba(255,255,255,0) 43%);
    }

    .theme-control-wrap {
      display: flex;
      justify-content: center;
      padding: 24px 0 calc(env(safe-area-inset-bottom) + 18px);
    }

    .theme-control {
      appearance: none;
      -webkit-appearance: none;
      width: 144px;
      height: 44px;
      border-radius: 999px;
      color: rgba(255,255,255,.96);
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 9px;
      font: inherit;
      font-size: 12px;
      font-weight: 760;
      letter-spacing: -.01em;
      cursor: pointer;
      padding: 0 15px;
    }

    .theme-control:active { transform: scale(.965); }

    .theme-control-icon {
      width: 18px;
      height: 18px;
      display: grid;
      place-items: center;
    }

    .theme-control-icon svg {
      width: 18px;
      height: 18px;
      display: block;
    }

    .theme-control-label {
      min-width: 76px;
      text-align: left;
    }

    @keyframes nightTwinkle {
      from { opacity: .72; filter: drop-shadow(0 0 2px rgba(190,220,255,.28)); }
      to   { opacity: 1; filter: drop-shadow(0 0 5px rgba(220,240,255,.52)); }
    }

  </style>
</head>
<body>
  <div class="ocean-bg" aria-hidden="true">
    <div class="ocean-world">

        <!-- palm on the sand -->

          <path d="M135 1325 C154 1254, 174 1187, 199 1113 C216 1063, 224 1025, 226 987" stroke="#7b5130" stroke-width="27" fill="none" stroke-linecap="round"/>

          <path d="M226 998 C268 964, 307 966, 343 988 C302 989, 273 1004, 240 1032Z" fill="#267f59" opacity=".96"/>
          <path d="M218 1000 C180 968, 151 970, 122 990 C157 991, 185 1004, 210 1032Z" fill="#318d63" opacity=".95"/>

          <circle cx="700" cy="1370" r="5"/><circle cx="730" cy="1410" r="3"/><circle cx="785" cy="1335" r="4"/><circle cx="630" cy="1490" r="3"/><circle cx="870" cy="1460" r="5"/>

      <div class="ocean-shimmer"></div>

    <div class="night-layer" aria-hidden="true">
      <div class="night-stars"></div>

    <div class="water-veil"></div>

  <div class="app">

  <script>
    const SEASONS = [

    const MIXED_RANGES = [

    const RECOMMENDED_RANGES = [[196,206],[384,384]];

    const SPECIAL_DETAILS = [
      { from: 54, to: 60, text: "Warship Island. Filler puro; se puede saltar para avanzar rápido." },
      { from: 98, to: 99, text: "Filler dentro de Arabasta; no es necesario para la historia principal." },
      { from: 102, to: 102, text: "Filler de Arabasta; puedes saltarlo sin perder trama." },
      { from: 131, to: 135, text: "Post-Alabasta. Historias tranquilas centradas en la tripulación; opcionales pero agradables." },
      { from: 136, to: 143, text: "Goat Island + Ruluka. Filler puro; prescindible para una primera visualización rápida." },
      { from: 196, to: 206, text: "G-8. Filler muy recomendado por la comunidad; merece la pena conservarlo." },
      { from: 220, to: 225, text: "Ocean's Dream / regreso de Foxy. Filler; se puede saltar." },
      { from: 279, to: 283, text: "Filler/recap de Enies Lobby; se puede saltar." },
      { from: 291, to: 292, text: "Especial alternativo de Boss Luffy; no pertenece a la continuidad principal." },
      { from: 303, to: 303, text: "Especial de Boss Luffy; no pertenece a la continuidad principal." },
      { from: 317, to: 319, text: "Post-Enies Lobby. Historias cortas de la tripulación; opcionales." },
      { from: 326, to: 336, text: "Ice Hunter. Filler largo; prescindible para avanzar rápido." },
      { from: 382, to: 383, text: "Spa Island. Filler puro; se puede saltar." },
      { from: 384, to: 384, text: "Episodio centrado en Brook intentando encontrar su lugar en la tripulación. Filler, pero muy recomendado." },
      { from: 406, to: 407, text: "Boss Luffy. Historia alternativa; se puede saltar." },
      { from: 426, to: 429, text: "Little East Blue. Preludio promocional de Strong World; no es necesario para la historia principal." },
      { from: 457, to: 458, text: "Recap previo a Marineford; se puede saltar." },
      { from: 492, to: 492, text: "Crossover; no pertenece a la historia principal de One Piece." },
      { from: 542, to: 542, text: "Crossover; no pertenece a la historia principal de One Piece." },
      { from: 575, to: 578, text: "Z's Ambition. Preludio de Film Z; solo interesa si planeas ver esa película." },
      { from: 590, to: 590, text: "Crossover; se puede saltar." },
      { from: 626, to: 627, text: "Caesar Retrieval. Filler puro. Ojo: el #628 sí es mixto y debe verse." },
      { from: 747, to: 750, text: "Silver Mine. Preludio de Film Gold; no es necesario para la historia principal." },
      { from: 780, to: 782, text: "Marine Rookie. Filler puro; se puede saltar." },
      { from: 895, to: 896, text: "Cidre Guild. Preludio de Stampede; no es necesario para la historia principal." },
      { from: 907, to: 907, text: "Especial basado en Romance Dawn; interesante como curiosidad, no necesario para la trama principal." },
      { from: 1029, to: 1030, text: "Pasado de Uta / conexión con Film Red. Opcional; útil sobre todo si vas a ver la película." }
    ];

    const eyeSVG = '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M2.7 12s3.4-5.8 9.3-5.8S21.3 12 21.3 12 17.9 17.8 12 17.8 2.7 12 2.7 12Z"/><circle cx="12" cy="12" r="2.8"/></svg>';
    const chevronSVG = '<svg class="chevron" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="m9 18 6-6-6-6"/></svg>';

    const statusMeta = {
      watch:       { label: 'VER', color: 'var(--green)' },
      anime:       { label: 'VER', color: 'var(--green)' },
      fresh:       { label: 'VER', color: 'var(--green)' },
      mixed:       { label: 'MIXTO', color: 'var(--orange)' },
      recommended: { label: 'VER ★', color: '#f5c542' },
      optional:    { label: 'OPCIONAL', color: 'var(--yellow)' },
      skip:        { label: 'SALTAR', color: 'var(--red)' },
      unknown:     { label: 'REVISAR', color: 'var(--gray)' }
    };

    const blockList = document.getElementById('blockList');
    const homeView = document.getElementById('homeView');
    const detailView = document.getElementById('detailView');
    const detailTitle = document.getElementById('detailTitle');
    const detailRange = document.getElementById('detailRange');
    const episodeList = document.getElementById('episodeList');
    const currentCard = document.getElementById('currentCard');
    const currentDock = document.getElementById('currentDock');
    const currentButton = document.getElementById('currentButton');
    const backButton = document.getElementById('backButton');
    const sheetBackdrop = document.getElementById('sheetBackdrop');
    const sheetNumber = document.getElementById('sheetNumber');
    const sheetStatus = document.getElementById('sheetStatus');
    const sheetText = document.getElementById('sheetText');
    const toast = document.getElementById('toast');
    const themeControl = document.getElementById('themeControl');
    const themeControlIcon = document.getElementById('themeControlIcon');
    const themeControlLabel = document.getElementById('themeControlLabel');
    const themeColorMeta = document.querySelector('meta[name="theme-color"]');


    let currentEpisode = Number(localStorage.getItem('oneGuideCurrentEpisode') || localStorage.getItem('oneGitCurrentEpisode')) || null;
    let openBlockIndex = null;
    let toastTimer = null;
    let themeMode = localStorage.getItem('oneGuideThemeMode') || 'auto';
    let themeClock = null;

    const appearanceIcons = {
      day: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="3.6"/><path d="M12 2.5v2.2M12 19.3v2.2M2.5 12h2.2M19.3 12h2.2M5.3 5.3l1.55 1.55M17.15 17.15l1.55 1.55M18.7 5.3l-1.55 1.55M6.85 17.15 5.3 18.7"/></svg>',
      night: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M20.2 15.2A8.4 8.4 0 0 1 8.8 3.8 8.6 8.6 0 1 0 20.2 15.2Z"/></svg>',
      auto: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="8.4"/><path d="M12 7.2V12l3.2 2"/><path d="M7.1 3.9 5.7 2.5M16.9 3.9l1.4-1.4"/></svg>'
    };

    function isNightByPhoneClock(now = new Date()) {
      const minute = now.getHours() * 60 + now.getMinutes();
      return minute < 390 || minute >= 1110; // 00:00–06:29 y 18:30–23:59
    }

    function effectiveAppearance() {
      if (themeMode === 'auto') return isNightByPhoneClock() ? 'night' : 'day';
      return themeMode;
    }

    function applyAppearance() {
      const effective = effectiveAppearance();
      document.body.classList.toggle('night-theme', effective === 'night');
      document.documentElement.dataset.appearance = effective;

      themeControlIcon.innerHTML = appearanceIcons[themeMode];
      themeControlLabel.textContent =
        themeMode === 'day' ? 'Día' :
        themeMode === 'night' ? 'Noche' :
        'Automático';

      const autoSuffix = themeMode === 'auto'
        ? ` · ${effective === 'night' ? 'noche' : 'día'} ahora`
        : '';

      themeControl.setAttribute('aria-label', `Apariencia: ${themeControlLabel.textContent}${autoSuffix}`);
      themeControl.title = `Apariencia: ${themeControlLabel.textContent}${autoSuffix}`;

      if (themeColorMeta) {
        themeColorMeta.setAttribute('content', effective === 'night' ? '#071b32' : '#7fd5fb');
      }
    }

    function cycleAppearance() {
      themeMode =
        themeMode === 'auto' ? 'day' :
        themeMode === 'day' ? 'night' :
        'auto';

      localStorage.setItem('oneGuideThemeMode', themeMode);
      applyAppearance();
    }


    function inRanges(n, ranges) {
      return ranges.some(([a,b]) => n >= a && n <= b);
    }

    function specialDetail(n) {
      return SPECIAL_DETAILS.find(item => n >= item.from && n <= item.to)?.text || '';
    }

    function classifyEpisode(n) {
      const special = specialDetail(n);

      if (inRanges(n, RECOMMENDED_RANGES)) {
        return { key:'recommended', label:'VER ★', full:'⭐ VER · FILLER BUENO', detail:special || 'Filler especialmente recomendado por esta guía.' };
      }
      if (inRanges(n, OPTIONAL_RANGES)) {
        return { key:'optional', label:'OPCIONAL', full:'🟡 OPCIONAL', detail:special || 'Filler prescindible para la trama, pero razonable si quieres verlo.' };
      }
      if (inRanges(n, FILLER_RANGES)) {
        return { key:'skip', label:'SALTAR', full:'🔴 SALTAR · FILLER', detail:special || 'Filler puro: puedes saltarlo sin perder la historia principal.' };
      }
      if (inRanges(n, MIXED_RANGES)) {
        return { key:'mixed', label:'MIXTO', full:'🟠 VER · MIXTO', detail:'Contiene material canon y filler. No conviene saltarlo.' };
      }
      if (inRanges(n, ANIME_CANON_RANGES)) {
        return { key:'anime', label:'VER', full:'🟢 VER · ANIME CANON', detail:'Anime canon. Para una primera visualización, se conserva.' };
      }
      if (inRanges(n, MANGA_RANGES)) {
        return { key:'watch', label:'VER', full:'🟢 VER · MANGA CANON', detail:'Material de la historia principal adaptado del manga.' };
      }
      if (n > 1175) {
        return { key:'fresh', label:'VER', full:'🟢 VER · EPISODIO NUEVO', detail:'Posterior a la última clasificación verificada. Se conserva por seguridad.' };
      }
      return { key:'unknown', label:'REVISAR', full:'⚪ SIN CLASIFICAR', detail:'La guía no tiene una clasificación segura para este episodio.' };
    }

    function buildEpisodeList(season) {
      const excluded = new Set(season.exclude || []);
      const list = [];
      for (let n = season.start; n <= season.end; n++) {
        if (!excluded.has(n)) list.push(n);
      }
      return list;
    }

    function getBlockForEpisode(n) {
      for (let i = 0; i < SEASONS.length; i++) {
        const episodes = buildEpisodeList(SEASONS[i]);
        const local = episodes.indexOf(n);
        if (local !== -1) return { index:i, season:SEASONS[i], local:local + 1 };
      }
      return null;
    }

    function renderBlocks() {
      blockList.innerHTML = '';
      SEASONS.forEach((season, index) => {
        const episodes = buildEpisodeList(season);
        const card = document.createElement('button');
        card.type = 'button';
        card.className = 'block-card glass';
        if (currentEpisode && episodes.includes(currentEpisode)) card.classList.add('is-current');

        const segments = episodes.map(n => {
          const s = classifyEpisode(n);
          return `<span style="--c:${statusMeta[s.key].color}"></span>`;
        }).join('');

        const currentInfo = currentEpisode && episodes.includes(currentEpisode)
          ? `<span class="block-now">${eyeSVG} Ep. ${episodes.indexOf(currentEpisode) + 1}</span>`
          : `<span class="block-now"></span>`;

        card.innerHTML = `
          <div class="block-head">
            <div class="block-copy">
              <div class="block-name">${season.name}</div>
              <div class="block-meta">#${episodes[0]}–#${episodes[episodes.length - 1]} · ${episodes.length} ep.</div>
            </div>
            ${currentInfo}
          </div>
          <div class="status-strip" aria-hidden="true">${segments}</div>
        `;
        card.addEventListener('click', () => openBlock(index, true));
        blockList.appendChild(card);
      });
    }

    function openBlock(index, push = false, scrollEpisode = null) {
      openBlockIndex = index;
      const season = SEASONS[index];
      const episodes = buildEpisodeList(season);
      document.body.classList.add('detail-mode');
      detailTitle.textContent = season.name;
      detailRange.textContent = `#${episodes[0]}–#${episodes[episodes.length - 1]} · ${episodes.length} episodios`;
      renderEpisodes(index);
      homeView.classList.add('hide');
      detailView.classList.add('show');
      if (push) history.pushState({ block:index }, '', `#block-${index}`);
      requestAnimationFrame(() => {
        if (scrollEpisode) {
          document.querySelector(`[data-episode="${scrollEpisode}"]`)?.scrollIntoView({ behavior:'smooth', block:'center' });
        } else {
          window.scrollTo({ top:0, behavior:'smooth' });
        }
      });
    }

    function renderEpisodes(index) {
      const season = SEASONS[index];
      const episodes = buildEpisodeList(season);
      episodeList.innerHTML = '';

      episodes.forEach((n, localIndex) => {
        const info = classifyEpisode(n);
        const meta = statusMeta[info.key];
        const row = document.createElement('div');
        row.className = 'episode-row';
        row.dataset.episode = String(n);
        row.style.setProperty('--status', meta.color);
        if (currentEpisode === n) row.classList.add('is-current');

        row.innerHTML = `
          <div class="episode-copy">
            <div class="episode-line">
              <span class="episode-local">Episodio ${localIndex + 1}</span>
              <span class="episode-global">#${n}</span>
            </div>
            <div class="episode-status">${info.label}</div>
          </div>
          <button class="eye-button ${currentEpisode === n ? 'active' : ''}" aria-label="Marcar episodio ${localIndex + 1} como actual">${eyeSVG}</button>
        `;

        row.addEventListener('click', () => showEpisodeSheet(n, season, localIndex + 1));
        row.querySelector('.eye-button').addEventListener('click', (event) => {
          event.stopPropagation();
          setCurrentEpisode(n);
        });
        episodeList.appendChild(row);
      });
    }

    function setCurrentEpisode(n) {
      currentEpisode = n;
      localStorage.setItem('oneGuideCurrentEpisode', String(n));
      localStorage.setItem('oneGitCurrentEpisode', String(n));
      renderBlocks();
      if (openBlockIndex !== null) renderEpisodes(openBlockIndex);
      renderCurrent();
      showToast(`#${n} marcado`);
    }

    function renderCurrent() {
      if (!currentEpisode) {
        currentCard.classList.remove('show');
        currentDock.classList.remove('show');
        return;
      }

      const pos = getBlockForEpisode(currentEpisode);
      if (!pos) return;
      const info = classifyEpisode(currentEpisode);
      const meta = statusMeta[info.key];
      const sub = `${pos.season.name} · Episodio ${pos.local}`;

      currentCard.style.setProperty('--status', meta.color);
      currentCard.innerHTML = `
        <div class="current-eye">${eyeSVG}</div>
        <div class="current-main">
          <div class="current-top"><span class="current-number">#${currentEpisode}</span><span class="current-status">${info.label}</span></div>
          <div class="current-sub">${sub}</div>
        </div>
        ${chevronSVG}
      `;
      currentCard.classList.add('show');

      currentDock.style.setProperty('--status', meta.color);
      currentDock.innerHTML = `
        <div class="dock-icon">${eyeSVG}</div>
        <div class="dock-copy">
          <div class="dock-title">#${currentEpisode} · Episodio ${pos.local}</div>
          <div class="dock-sub">${pos.season.name}</div>
        </div>
        <div class="dock-status">${info.label}</div>
      `;
      currentDock.classList.add('show');
    }

    function goCurrent() {
      if (!currentEpisode) {
        showToast('Toca el ojo de un episodio');
        return;
      }
      const pos = getBlockForEpisode(currentEpisode);
      if (!pos) return;
      openBlock(pos.index, true, currentEpisode);
    }

    function showEpisodeSheet(n, season, local) {
      const info = classifyEpisode(n);
      const meta = statusMeta[info.key];
      sheetNumber.textContent = `${season.name} · Episodio ${local} · #${n}`;
      sheetStatus.textContent = info.full;
      sheetStatus.style.setProperty('--status', meta.color);
      sheetText.textContent = info.detail;
      sheetBackdrop.classList.add('show');
      sheetBackdrop.setAttribute('aria-hidden', 'false');
    }

    function closeSheet() {
      sheetBackdrop.classList.remove('show');
      sheetBackdrop.setAttribute('aria-hidden', 'true');
    }

    function showHome() {
      openBlockIndex = null;
      document.body.classList.remove('detail-mode');
      detailView.classList.remove('show');
      homeView.classList.remove('hide');
      window.scrollTo({ top:0, behavior:'smooth' });
    }

    function showToast(message) {
      clearTimeout(toastTimer);
      toast.textContent = message;
      toast.classList.add('show');
      toastTimer = setTimeout(() => toast.classList.remove('show'), 1450);
    }

    currentCard.addEventListener('click', goCurrent);
    currentCard.addEventListener('keydown', e => { if (e.key === 'Enter' || e.key === ' ') goCurrent(); });
    currentDock.addEventListener('click', goCurrent);
    currentDock.addEventListener('keydown', e => { if (e.key === 'Enter' || e.key === ' ') goCurrent(); });
    currentButton.addEventListener('click', goCurrent);
    themeControl.addEventListener('click', cycleAppearance);
    backButton.addEventListener('click', () => history.back());
    sheetBackdrop.addEventListener('click', e => { if (e.target === sheetBackdrop) closeSheet(); });
    document.addEventListener('keydown', e => { if (e.key === 'Escape') closeSheet(); });

    window.addEventListener('popstate', () => {
      const match = location.hash.match(/^#block-(\d+)$/);
      if (match) {
        openBlock(Number(match[1]), false);
      } else {
        showHome();
      }
    });

    applyAppearance();
    themeClock = setInterval(() => {
      if (themeMode === 'auto') applyAppearance();
    }, 60000);
    document.addEventListener('visibilitychange', () => {
      if (!document.hidden && themeMode === 'auto') applyAppearance();
    });

    renderBlocks();
    renderCurrent();

    const initial = location.hash.match(/^#block-(\d+)$/);
    if (initial && SEASONS[Number(initial[1])]) openBlock(Number(initial[1]), false);
  </script>
</body>
</html>
