<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#08090c">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="One Guide">
  <title>One Guide</title>
  <style>
    :root {
      color-scheme: dark;
      --bg: #081a2a;
      --text: rgba(255,255,255,.96);
      --muted: rgba(255,255,255,.56);
      --hairline: rgba(255,255,255,.14);
      --glass: rgba(255,255,255,.09);
      --glass-strong: rgba(255,255,255,.16);
      --shadow: 0 22px 64px rgba(0, 10, 24, .28);
      --green: #34c759;
      --orange: #ff9f0a;
      --yellow: #ffd60a;
      --red: #ff453a;
      --gray: #8e8e93;
      --blue: #0a84ff;
      --radius: 26px;
    }

    * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
    html, body { min-height: 100%; margin: 0; background: linear-gradient(180deg, #061423 0%, #08253a 38%, #0a2540 58%, #0e1c2c 100%); }
    body {
      font-family: -apple-system, BlinkMacSystemFont, "SF Pro Display", "SF Pro Text", "Helvetica Neue", Arial, sans-serif;
      color: var(--text);
      overflow-x: hidden;
      position: relative;
    }

    body::before,
    body::after {
      content: "";
      position: fixed;
      z-index: -3;
      border-radius: 50%;
      filter: blur(80px);
      pointer-events: none;
      opacity: .55;
    }
    body::before {
      width: 340px;
      height: 340px;
      top: -110px;
      left: -85px;
      background: radial-gradient(circle, rgba(255, 211, 137, .62), rgba(255, 211, 137, 0) 72%);
    }
    body::after {
      width: 420px;
      height: 420px;
      right: -180px;
      top: 18%;
      background: radial-gradient(circle, rgba(80, 200, 255, .28), rgba(80, 200, 255, 0) 72%);
    }

    .ocean-bg {
      position: fixed;
      inset: 0;
      z-index: -4;
      pointer-events: none;
      overflow: hidden;
      background: linear-gradient(180deg, #85d9ff 0%, #6cc8ff 22%, #5cbef4 38%, #1f95c9 48%, #146e9f 58%, #0f446c 100%);
      transition: background 1s ease;
    }
    .scene {
      position: absolute;
      inset: 0;
      transition: opacity .95s ease, transform 1.2s cubic-bezier(.22,1,.36,1), filter 1s ease;
    }

    .beach-scene {
      opacity: 1;
      transform: translateY(0) scale(1);
    }
    .beach-scene .sun {
      position: absolute;
      top: 6%;
      left: 10%;
      width: 128px;
      height: 128px;
      border-radius: 50%;
      background: radial-gradient(circle, rgba(255,248,220,.98) 0 28%, rgba(255,230,170,.94) 29% 44%, rgba(255,216,138,.40) 54%, rgba(255,216,138,0) 72%);
      filter: blur(.4px);
      box-shadow: 0 0 40px rgba(255,228,160,.35);
    }
    .beach-scene .cloud {
      position: absolute;
      height: 24px;
      border-radius: 999px;
      background: rgba(255,255,255,.42);
      filter: blur(3px);
      opacity: .82;
      animation: cloudFloat linear infinite;
    }
    .beach-scene .cloud::before,
    .beach-scene .cloud::after {
      content: "";
      position: absolute;
      background: inherit;
      border-radius: inherit;
    }
    .beach-scene .cloud::before { width: 34px; height: 34px; left: 10px; bottom: 8px; }
    .beach-scene .cloud::after { width: 40px; height: 40px; right: 12px; bottom: 4px; }
    .beach-scene .cloud.c1 { top: 13%; left: 10%; width: 92px; animation-duration: 23s; }
    .beach-scene .cloud.c2 { top: 20%; right: 12%; width: 118px; animation-duration: 31s; animation-delay: -6s; }
    .beach-scene .cloud.c3 { top: 29%; left: 18%; width: 72px; height: 18px; animation-duration: 27s; animation-delay: -12s; }

    .beach-scene .horizon-glow {
      position: absolute;
      inset: 24% 0 auto;
      height: 20%;
      background: linear-gradient(180deg, rgba(255,255,255,.18), rgba(255,255,255,0));
      opacity: .4;
    }
    .beach-scene .sea-back,
    .beach-scene .sea-front {
      position: absolute;
      left: -12%;
      width: 124%;
      background-repeat: repeat-x;
      background-size: 280px 100%;
      border-radius: 47% 53% 0 0 / 16% 16% 0 0;
      animation: waveDrift linear infinite;
      box-shadow: inset 0 1px 0 rgba(255,255,255,.24);
    }
    .beach-scene .sea-back {
      bottom: 18%;
      height: 40%;
      background-image:
        linear-gradient(180deg, rgba(44,170,221,.52), rgba(17,110,171,.82)),
        radial-gradient(circle at 48px 22px, rgba(255,255,255,.18) 0 7px, transparent 8px),
        radial-gradient(circle at 175px 28px, rgba(255,255,255,.10) 0 6px, transparent 7px);
      animation-duration: 16s;
      opacity: .92;
    }
    .beach-scene .sea-front {
      bottom: 8%;
      height: 28%;
      background-image:
        linear-gradient(180deg, rgba(92,214,226,.74), rgba(19,130,174,.94)),
        radial-gradient(circle at 58px 24px, rgba(255,255,255,.22) 0 7px, transparent 8px),
        radial-gradient(circle at 185px 16px, rgba(255,255,255,.12) 0 6px, transparent 7px);
      animation-duration: 11s;
      animation-direction: reverse;
    }
    .beach-scene .foam {
      position: absolute;
      left: -8%;
      width: 116%;
      bottom: 22%;
      height: 16px;
      border-radius: 999px;
      background: linear-gradient(180deg, rgba(255,255,255,.72), rgba(255,255,255,0));
      filter: blur(6px);
      animation: foamMove 10s ease-in-out infinite alternate;
      opacity: .82;
    }
    .beach-scene .island {
      position: absolute;
      right: 10%;
      bottom: 28%;
      width: 116px;
      height: 58px;
      border-radius: 55% 45% 40% 60% / 70% 60% 40% 30%;
      background: linear-gradient(180deg, rgba(44,88,68,.95), rgba(24,55,47,.98));
      box-shadow: 0 18px 26px rgba(0,0,0,.08);
      transform: rotate(-4deg);
      opacity: .86;
    }
    .beach-scene .island::before {
      content: "";
      position: absolute;
      left: 22px;
      top: -32px;
      width: 7px;
      height: 40px;
      background: #6d4e33;
      border-radius: 999px;
      box-shadow: 16px 4px 0 -1px #6d4e33;
      transform: rotate(-12deg);
    }
    .beach-scene .island::after {
      content: "";
      position: absolute;
      left: 8px;
      top: -44px;
      width: 48px;
      height: 34px;
      background: radial-gradient(circle at 20% 50%, #2e7d58 0 28%, transparent 29%), radial-gradient(circle at 80% 50%, #2f875d 0 28%, transparent 29%), radial-gradient(circle at 50% 20%, #3f9f6f 0 30%, transparent 31%);
      transform: rotate(-9deg);
      opacity: .9;
    }
    .beach-scene .shore {
      position: absolute;
      left: -8%;
      right: -8%;
      bottom: -4%;
      height: 29%;
      border-radius: 55% 45% 0 0 / 22% 18% 0 0;
      background: linear-gradient(180deg, #f8ebc9 0%, #f1d8a6 55%, #ddb67f 100%);
      box-shadow: inset 0 1px 0 rgba(255,255,255,.46), 0 -16px 30px rgba(0,0,0,.05);
    }
    .beach-scene .shore::before {
      content: "";
      position: absolute;
      top: 0;
      left: 12%;
      width: 76%;
      height: 20px;
      border-radius: 999px;
      background: linear-gradient(180deg, rgba(255,255,255,.75), rgba(255,255,255,0));
      filter: blur(5px);
      opacity: .92;
    }
    .beach-scene .shore::after {
      content: "";
      position: absolute;
      inset: auto 12% 25% auto;
      width: 96px;
      height: 54px;
      background: radial-gradient(circle at 25% 30%, rgba(210,180,128,.28) 0 4px, transparent 5px), radial-gradient(circle at 70% 70%, rgba(210,180,128,.22) 0 4px, transparent 5px), radial-gradient(circle at 58% 24%, rgba(210,180,128,.18) 0 3px, transparent 4px);
      opacity: .8;
    }

    .underwater-scene {
      opacity: 0;
      transform: translateY(8%) scale(1.04);
      filter: saturate(.9);
    }
    .underwater-scene .underwater-tint {
      position: absolute;
      inset: 0;
      background: linear-gradient(180deg, rgba(112,219,255,.18) 0%, rgba(22,132,182,.24) 22%, rgba(10,86,133,.72) 58%, rgba(9,43,77,.92) 100%);
    }
    .underwater-scene .rays {
      position: absolute;
      inset: 0;
      background: linear-gradient(112deg, rgba(255,255,255,.18), rgba(255,255,255,0) 18%), linear-gradient(86deg, rgba(255,255,255,.12), rgba(255,255,255,0) 22%), linear-gradient(124deg, rgba(255,255,255,.08), rgba(255,255,255,0) 18%);
      mask: linear-gradient(180deg, rgba(0,0,0,.9), rgba(0,0,0,0) 64%);
      opacity: .72;
    }
    .underwater-scene .bubble {
      position: absolute;
      bottom: -12%;
      width: 14px;
      height: 14px;
      border-radius: 50%;
      border: 1px solid rgba(255,255,255,.45);
      background: radial-gradient(circle at 30% 30%, rgba(255,255,255,.52), rgba(255,255,255,.08) 56%, rgba(255,255,255,0) 57%);
      animation: bubbleRise linear infinite;
      opacity: .62;
    }
    .underwater-scene .bubble.b1 { left: 12%; animation-duration: 8s; }
    .underwater-scene .bubble.b2 { left: 25%; width: 10px; height: 10px; animation-duration: 11s; animation-delay: -2.5s; }
    .underwater-scene .bubble.b3 { right: 18%; width: 18px; height: 18px; animation-duration: 10s; animation-delay: -5s; }
    .underwater-scene .bubble.b4 { right: 32%; width: 8px; height: 8px; animation-duration: 7s; animation-delay: -1.5s; }
    .underwater-scene .bubble.b5 { left: 58%; width: 12px; height: 12px; animation-duration: 9s; animation-delay: -4.2s; }
    .underwater-scene .fish {
      position: absolute;
      width: 34px;
      height: 18px;
      border-radius: 999px 70% 70% 999px;
      background: linear-gradient(90deg, rgba(255,202,90,.94), rgba(255,143,78,.94));
      box-shadow: inset -3px 0 0 rgba(255,255,255,.18);
      opacity: .78;
      animation: fishSwim linear infinite;
    }
    .underwater-scene .fish::before {
      content: "";
      position: absolute;
      right: -8px;
      top: 3px;
      width: 12px;
      height: 12px;
      background: inherit;
      clip-path: polygon(0 50%, 100% 0, 100% 100%);
    }
    .underwater-scene .fish::after {
      content: "";
      position: absolute;
      left: 7px;
      top: 6px;
      width: 3px;
      height: 3px;
      background: rgba(25,45,60,.8);
      border-radius: 50%;
    }
    .underwater-scene .fish.f1 { top: 26%; left: -16%; animation-duration: 18s; }
    .underwater-scene .fish.f2 { top: 40%; right: -18%; transform: scale(.86) scaleX(-1); animation-duration: 21s; animation-delay: -7s; }
    .underwater-scene .fish.f3 { top: 56%; left: -14%; transform: scale(.7); animation-duration: 24s; animation-delay: -10s; }
    .underwater-scene .coral,
    .underwater-scene .seaweed {
      position: absolute;
      bottom: 9%;
      opacity: .85;
    }
    .underwater-scene .coral.coral1 {
      left: 6%;
      width: 80px;
      height: 92px;
      background: radial-gradient(circle at 26px 18px, #ff8fb0 0 11px, transparent 12px), radial-gradient(circle at 44px 30px, #ff7798 0 12px, transparent 13px), radial-gradient(circle at 58px 18px, #ff9f9c 0 10px, transparent 11px), linear-gradient(180deg, transparent 0 38%, #ff7d9a 39% 100%);
      clip-path: polygon(22% 100%, 34% 55%, 29% 36%, 39% 24%, 49% 35%, 54% 16%, 62% 28%, 70% 18%, 77% 32%, 67% 50%, 76% 68%, 66% 100%);
      filter: drop-shadow(0 10px 12px rgba(0,0,0,.14));
    }
    .underwater-scene .coral.coral2 {
      right: 10%;
      width: 72px;
      height: 86px;
      background: linear-gradient(180deg, #8b73ff, #5b45d4);
      clip-path: polygon(22% 100%, 32% 55%, 22% 25%, 35% 39%, 42% 16%, 52% 33%, 58% 10%, 68% 38%, 78% 20%, 74% 47%, 86% 63%, 72% 100%);
      opacity: .82;
      filter: drop-shadow(0 10px 12px rgba(0,0,0,.12));
    }
    .underwater-scene .seaweed.w1,
    .underwater-scene .seaweed.w2 {
      width: 52px;
      height: 130px;
      background: linear-gradient(180deg, transparent 0 16%, #3da67d 17% 100%);
      clip-path: polygon(44% 100%, 49% 76%, 35% 58%, 44% 40%, 34% 17%, 48% 28%, 57% 10%, 62% 34%, 74% 18%, 71% 44%, 82% 62%, 66% 80%, 60% 100%);
      transform-origin: bottom center;
      animation: seaweedSway 6s ease-in-out infinite alternate;
    }
    .underwater-scene .seaweed.w1 { left: 22%; }
    .underwater-scene .seaweed.w2 { right: 28%; animation-duration: 7.5s; animation-delay: -2s; }
    .underwater-scene .seafloor {
      position: absolute;
      left: -6%;
      right: -6%;
      bottom: -2%;
      height: 22%;
      border-radius: 55% 45% 0 0 / 18% 18% 0 0;
      background: linear-gradient(180deg, rgba(227,203,156,.92), rgba(197,161,113,.98));
      box-shadow: inset 0 1px 0 rgba(255,255,255,.18);
    }

    body.detail-mode .ocean-bg {
      background: linear-gradient(180deg, #4fc4f1 0%, #2ba0d0 18%, #157baa 36%, #0d5f8f 58%, #0b436b 76%, #08223f 100%);
    }
    body.detail-mode .beach-scene {
      opacity: .12;
      transform: translateY(-18%) scale(1.07);
      filter: blur(4px) saturate(.7);
    }
    body.detail-mode .underwater-scene {
      opacity: 1;
      transform: translateY(0) scale(1);
      filter: saturate(1.02);
    }

    @keyframes waveDrift {
      from { transform: translateX(0); }
      to { transform: translateX(-150px); }
    }
    @keyframes foamMove {
      from { transform: translateX(-8px) scaleX(1); }
      to { transform: translateX(12px) scaleX(1.03); }
    }
    @keyframes cloudFloat {
      from { transform: translateX(0); }
      to { transform: translateX(38px); }
    }
    @keyframes bubbleRise {
      0% { transform: translateY(0) translateX(0) scale(.85); opacity: 0; }
      12% { opacity: .62; }
      100% { transform: translateY(-120vh) translateX(18px) scale(1.15); opacity: 0; }
    }
    @keyframes fishSwim {
      0% { transform: translateX(0) scale(var(--fish-scale,1)); }
      100% { transform: translateX(140vw) scale(var(--fish-scale,1)); }
    }
    .underwater-scene .fish.f2 { --fish-scale: .86; }
    .underwater-scene .fish.f3 { --fish-scale: .7; }
    @keyframes seaweedSway {
      from { transform: rotate(-4deg); }
      to { transform: rotate(5deg); }
    }
    .app {
      width: min(100%, 520px);
      margin: 0 auto;
      min-height: 100svh;
      padding: calc(env(safe-area-inset-top) + 10px) 14px calc(env(safe-area-inset-bottom) + 96px);
    }

    .glass {
      background: linear-gradient(180deg, rgba(255,255,255,.18), rgba(255,255,255,.06));
      border: 1px solid rgba(255,255,255,.14);
      box-shadow: inset 0 1px 0 rgba(255,255,255,.22), inset 0 -1px 0 rgba(255,255,255,.03), 0 18px 46px rgba(2, 16, 31, .26);
      backdrop-filter: blur(30px) saturate(175%);
      -webkit-backdrop-filter: blur(30px) saturate(175%);
    }

    .topbar {
      position: sticky;
      overflow: hidden;
      top: calc(env(safe-area-inset-top) + 8px);
      z-index: 30;
      height: 60px;
      border-radius: 22px;
      padding: 8px 10px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      margin-bottom: 12px;
    }

    .brand {
      display: flex;
      align-items: center;
      gap: 10px;
      min-width: 0;
    }

    .logo-wrap {
      width: 38px;
      height: 38px;
      display: grid;
      place-items: center;
      background: transparent;
      border: 0;
      box-shadow: none;
      overflow: visible;
      position: relative;
    }
    .logo-wrap::before,
    .logo-wrap::after { content: none; }
    .logo-wrap img {
      width: 38px;
      height: 38px;
      object-fit: contain;
      display: block;
      filter: drop-shadow(0 6px 10px rgba(0,0,0,.14));
    }
    .brand-name { font-size: 20px; line-height: 1; font-weight: 760; letter-spacing: -.52px; text-shadow: 0 1px 0 rgba(255,255,255,.14); }

    .icon-button {
      width: 42px;
      height: 42px;
      border: 0;
      border-radius: 14px;
      background: rgba(255,255,255,.075);
      color: rgba(255,255,255,.92);
      display: grid;
      place-items: center;
      padding: 0;
      cursor: pointer;
    }
    .icon-button:active { transform: scale(.96); background: rgba(255,255,255,.13); }
    .icon-button svg { width: 21px; height: 21px; }

    .legend {
      display: flex;
      position: relative;
      gap: 7px;
      overflow-x: auto;
      scrollbar-width: none;
      padding: 1px 1px 10px;
      margin: 0 0 2px;
    }
    .legend::-webkit-scrollbar { display: none; }

    .chip {
      flex: 0 0 auto;
      backdrop-filter: blur(20px) saturate(150%);
      -webkit-backdrop-filter: blur(20px) saturate(150%);
      display: inline-flex;
      align-items: center;
      gap: 6px;
      min-height: 30px;
      padding: 0 10px;
      border-radius: 999px;
      background: rgba(255,255,255,.055);
      border: 1px solid rgba(255,255,255,.085);
      color: rgba(255,255,255,.76);
      font-size: 11px;
      font-weight: 700;
      letter-spacing: .02em;
    }
    .dot { width: 7px; height: 7px; border-radius: 50%; background: var(--c); box-shadow: 0 0 12px color-mix(in srgb, var(--c) 58%, transparent); }

    .current-card {
      display: none;
      width: 100%;
      min-height: 78px;
      border-radius: 24px;
      margin: 2px 0 12px;
      padding: 13px 14px;
      align-items: center;
      gap: 12px;
      cursor: pointer;
    }
    .current-card.show { display: flex; }
    .current-eye {
      width: 42px; height: 42px; flex: 0 0 auto; border-radius: 50%;
      display: grid; place-items: center;
      background: rgba(10,132,255,.16);
      border: 1px solid rgba(10,132,255,.26);
      color: #79baff;
    }
    .current-eye svg { width: 21px; height: 21px; }
    .current-main { min-width: 0; flex: 1; }
    .current-top { display:flex; align-items:center; gap:8px; min-width:0; }
    .current-number { font-size: 20px; font-weight: 760; letter-spacing: -.45px; }
    .current-status { font-size: 11px; font-weight: 800; letter-spacing: .03em; color: var(--status); }
    .current-sub { margin-top: 3px; font-size: 12px; color: var(--muted); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
    .chevron { width:18px; height:18px; opacity:.5; flex:0 0 auto; }

    .block-list { display: grid; grid-template-columns: 1fr; gap: 9px; }

    .block-card {
      width: 100%;
      background: linear-gradient(180deg, rgba(255,255,255,.14), rgba(255,255,255,.05));
      border: 0;
      border-radius: 22px;
      padding: 14px 14px 12px;
      text-align: left;
      color: inherit;
      cursor: pointer;
      position: relative;
      overflow: hidden;
    }
    .block-card:active { transform: scale(.988); }
    .block-head { display:flex; align-items:flex-start; gap:12px; }
    .block-copy { flex:1; min-width:0; }
    .block-name { font-size: 16px; font-weight: 680; letter-spacing: -.2px; line-height:1.18; }
    .block-meta { margin-top:5px; font-size: 11px; color: var(--muted); font-weight: 600; }
    .block-now {
      display:none;
      align-items:center;
      gap:5px;
      font-size:10px;
      font-weight:800;
      color:#79baff;
      background:rgba(10,132,255,.14);
      border:1px solid rgba(10,132,255,.19);
      border-radius:999px;
      padding:5px 8px;
      white-space:nowrap;
    }
    .block-card.is-current .block-now { display:inline-flex; }
    .block-now svg { width:12px; height:12px; }
    .status-strip { display:flex; gap:2px; height:5px; margin-top:12px; border-radius:999px; overflow:hidden; }
    .status-strip span { min-width:1px; flex:1; background:var(--c); opacity:.9; }

    .detail-view { display:none; }
    .detail-view.show { display:block; animation:fadeIn .18s ease; }
    .home-view.hide { display:none; }
    @keyframes fadeIn { from {opacity:0; transform:translateY(5px)} to {opacity:1; transform:none} }

    .detail-head {
      position: sticky;
      top: calc(env(safe-area-inset-top) + 80px);
      z-index: 22;
      border-radius: 24px;
      padding: 10px;
      margin-bottom: 10px;
      display:flex;
      align-items:center;
      gap:10px;
    }
    .back-button { flex:0 0 auto; }
    .detail-title-wrap { min-width:0; flex:1; }
    .detail-title { font-size:17px; font-weight:720; letter-spacing:-.25px; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
    .detail-range { margin-top:3px; font-size:11px; color:var(--muted); font-weight:600; }

    .episode-list { display:grid; gap:7px; }
    .episode-row {
      position:relative;
      min-height: 62px;
      border-radius: 20px;
      padding: 9px 9px 9px 13px;
      display:flex;
      align-items:center;
      gap:10px;
      cursor:pointer;
      background:linear-gradient(180deg, rgba(255,255,255,.08), rgba(255,255,255,.045));
      border:1px solid rgba(255,255,255,.075);
      backdrop-filter: blur(18px) saturate(150%);
      -webkit-backdrop-filter: blur(18px) saturate(150%);
    }
    .episode-row::before {
      content:"";
      position:absolute;
      left:0;
      top:12px;
      bottom:12px;
      width:3px;
      border-radius:0 999px 999px 0;
      background:var(--status);
    }
    .episode-row.is-current {
      background:linear-gradient(180deg, rgba(10,132,255,.16), rgba(10,132,255,.075));
      border-color:rgba(10,132,255,.28);
      box-shadow:0 0 0 1px rgba(10,132,255,.06) inset;
    }
    .episode-copy { min-width:0; flex:1; }
    .episode-line { display:flex; align-items:baseline; gap:8px; }
    .episode-local { font-size:15px; font-weight:680; letter-spacing:-.15px; }
    .episode-global { font-size:11px; color:var(--muted); font-weight:650; }
    .episode-status { margin-top:4px; font-size:10px; font-weight:840; letter-spacing:.045em; color:var(--status); }

    .eye-button {
      width:42px;
      height:42px;
      flex:0 0 auto;
      border:0;
      border-radius:14px;
      padding:0;
      color:rgba(255,255,255,.52);
      background:rgba(255,255,255,.055);
      display:grid;
      place-items:center;
      cursor:pointer;
    }
    .eye-button svg { width:20px; height:20px; }
    .eye-button.active { color:#8bc5ff; background:rgba(10,132,255,.16); }
    .eye-button:active { transform:scale(.95); }

    .current-dock {
      position:fixed;
      z-index:40;
      left:50%;
      bottom:calc(env(safe-area-inset-bottom) + 14px);
      transform:translateX(-50%) translateY(120px);
      width:min(calc(100% - 28px), 492px);
      min-height:60px;
      border-radius:23px;
      padding:8px 10px;
      display:flex;
      align-items:center;
      gap:10px;
      transition:transform .28s cubic-bezier(.2,.8,.2,1), opacity .2s ease;
      opacity:0;
      cursor:pointer;
    }
    .current-dock.show { transform:translateX(-50%) translateY(0); opacity:1; }
    .dock-icon { width:40px; height:40px; border-radius:14px; display:grid; place-items:center; background:rgba(10,132,255,.15); color:#83c0ff; }
    .dock-icon svg { width:20px; height:20px; }
    .dock-copy { flex:1; min-width:0; }
    .dock-title { font-size:14px; font-weight:730; letter-spacing:-.1px; }
    .dock-sub { margin-top:2px; font-size:11px; color:var(--muted); white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
    .dock-status { font-size:10px; font-weight:850; color:var(--status); letter-spacing:.04em; }

    .sheet-backdrop {
      position:fixed;
      inset:0;
      z-index:70;
      background:rgba(0,0,0,.34);
      opacity:0;
      pointer-events:none;
      transition:opacity .2s ease;
      backdrop-filter:blur(3px);
      -webkit-backdrop-filter:blur(3px);
    }
    .sheet-backdrop.show { opacity:1; pointer-events:auto; }
    .sheet {
      position:absolute;
      left:50%;
      bottom:calc(env(safe-area-inset-bottom) + 10px);
      transform:translate(-50%, 28px);
      width:min(calc(100% - 20px), 500px);
      border-radius:30px;
      padding:20px;
      opacity:0;
      transition:transform .22s cubic-bezier(.2,.8,.2,1), opacity .18s ease;
    }
    .sheet-backdrop.show .sheet { transform:translate(-50%, 0); opacity:1; }
    .sheet-grabber { width:40px; height:5px; border-radius:999px; background:rgba(255,255,255,.18); margin:-7px auto 16px; }
    .sheet-number { font-size:12px; color:var(--muted); font-weight:700; }
    .sheet-status { margin-top:6px; font-size:22px; font-weight:780; letter-spacing:-.45px; color:var(--status); }
    .sheet-text { margin-top:10px; font-size:14px; line-height:1.42; color:rgba(255,255,255,.74); }

    .toast {
      position:fixed;
      z-index:90;
      top:calc(env(safe-area-inset-top) + 84px);
      left:50%;
      transform:translate(-50%, -12px);
      max-width:calc(100% - 32px);
      padding:10px 14px;
      border-radius:999px;
      background:rgba(26,26,30,.82);
      border:1px solid rgba(255,255,255,.11);
      backdrop-filter:blur(22px) saturate(160%);
      -webkit-backdrop-filter:blur(22px) saturate(160%);
      font-size:12px;
      font-weight:700;
      color:rgba(255,255,255,.88);
      opacity:0;
      pointer-events:none;
      transition:opacity .18s ease, transform .18s ease;
      white-space:nowrap;
    }
    .toast.show { opacity:1; transform:translate(-50%, 0); }

    @media (min-width: 470px) {
      .block-list { grid-template-columns: 1fr 1fr; }
    }

    @media (prefers-reduced-motion: reduce) {
      *, *::before, *::after { scroll-behavior:auto !important; transition:none !important; animation:none !important; }
    }
  </style>
</head>

      { from: 590, to: 590, text: "Crossover; se puede saltar." },
      { from: 626, to: 627, text: "Caesar Retrieval. Filler puro. Ojo: el #628 sí es mixto y debe verse." },
      { from: 747, to: 750, text: "Silver Mine. Preludio de Film Gold; no es necesario para la historia principal." },
      { from: 780, to: 782, text: "Marine Rookie. Filler puro; se puede saltar." },
      { from: 895, to: 896, text: "Cidre Guild. Preludio de Stampede; no es necesario para la historia principal." },
      { from: 907, to: 907, text: "Especial basado en Romance Dawn; interesante como curiosidad, no necesario para la trama principal." },
      { from: 1029, to: 1030, text: "Pasado de Uta / conexión con Film Red. Opcional; útil sobre todo si vas a ver la película." }
    ];

    const eyeSVG = '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M2.7 12s3.4-5.8 9.3-5.8S21.3 12 21.3 12 17.9 17.8 12 17.8 2.7 12 2.7 12Z"/><circle cx="12" cy="12" r="2.8"/></svg>';
    const chevronSVG = '<svg class="chevron" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="m9 18 6-6-6-6"/></svg>';

    const statusMeta = {
      watch:       { label: 'VER', color: 'var(--green)' },
      anime:       { label: 'VER', color: 'var(--green)' },
      fresh:       { label: 'VER', color: 'var(--green)' },
      mixed:       { label: 'MIXTO', color: 'var(--orange)' },
      recommended: { label: 'VER ★', color: '#f5c542' },
      optional:    { label: 'OPCIONAL', color: 'var(--yellow)' },
      skip:        { label: 'SALTAR', color: 'var(--red)' },
      unknown:     { label: 'REVISAR', color: 'var(--gray)' }
    };

    const blockList = document.getElementById('blockList');
    const homeView = document.getElementById('homeView');
    const detailView = document.getElementById('detailView');
    const detailTitle = document.getElementById('detailTitle');
    const detailRange = document.getElementById('detailRange');
    const episodeList = document.getElementById('episodeList');
    const currentCard = document.getElementById('currentCard');
    const currentDock = document.getElementById('currentDock');
    const currentButton = document.getElementById('currentButton');
    const backButton = document.getElementById('backButton');
    const sheetBackdrop = document.getElementById('sheetBackdrop');
    const sheetNumber = document.getElementById('sheetNumber');
    const sheetStatus = document.getElementById('sheetStatus');
    const sheetText = document.getElementById('sheetText');
    const toast = document.getElementById('toast');

    let currentEpisode = Number(localStorage.getItem('oneGuideCurrentEpisode') || localStorage.getItem('oneGitCurrentEpisode')) || null;
    let openBlockIndex = null;
    let toastTimer = null;

    function inRanges(n, ranges) {
      return ranges.some(([a,b]) => n >= a && n <= b);
    }

    function specialDetail(n) {
      return SPECIAL_DETAILS.find(item => n >= item.from && n <= item.to)?.text || '';
    }

    function classifyEpisode(n) {
      const special = specialDetail(n);

      if (inRanges(n, RECOMMENDED_RANGES)) {
        return { key:'recommended', label:'VER ★', full:'⭐ VER · FILLER BUENO', detail:special || 'Filler especialmente recomendado por esta guía.' };
      }
      if (inRanges(n, OPTIONAL_RANGES)) {
        return { key:'optional', label:'OPCIONAL', full:'🟡 OPCIONAL', detail:special || 'Filler prescindible para la trama, pero razonable si quieres verlo.' };
      }
      if (inRanges(n, FILLER_RANGES)) {
        return { key:'skip', label:'SALTAR', full:'🔴 SALTAR · FILLER', detail:special || 'Filler puro: puedes saltarlo sin perder la historia principal.' };
      }
      if (inRanges(n, MIXED_RANGES)) {
        return { key:'mixed', label:'MIXTO', full:'🟠 VER · MIXTO', detail:'Contiene material canon y filler. No conviene saltarlo.' };
      }
      if (inRanges(n, ANIME_CANON_RANGES)) {
        return { key:'anime', label:'VER', full:'🟢 VER · ANIME CANON', detail:'Anime canon. Para una primera visualización, se conserva.' };
      }
      if (inRanges(n, MANGA_RANGES)) {
        return { key:'watch', label:'VER', full:'🟢 VER · MANGA CANON', detail:'Material de la historia principal adaptado del manga.' };
      }
      if (n > 1175) {
        return { key:'fresh', label:'VER', full:'🟢 VER · EPISODIO NUEVO', detail:'Posterior a la última clasificación verificada. Se conserva por seguridad.' };
      }
      return { key:'unknown', label:'REVISAR', full:'⚪ SIN CLASIFICAR', detail:'La guía no tiene una clasificación segura para este episodio.' };
    }

    function buildEpisodeList(season) {
      const excluded = new Set(season.exclude || []);
      const list = [];
      for (let n = season.start; n <= season.end; n++) {
        if (!excluded.has(n)) list.push(n);
      }
      return list;
    }

    function getBlockForEpisode(n) {
      for (let i = 0; i < SEASONS.length; i++) {
        const episodes = buildEpisodeList(SEASONS[i]);
        const local = episodes.indexOf(n);
        if (local !== -1) return { index:i, season:SEASONS[i], local:local + 1 };
      }
      return null;
    }

    function renderBlocks() {
      blockList.innerHTML = '';
      SEASONS.forEach((season, index) => {
        const episodes = buildEpisodeList(season);
        const card = document.createElement('button');
        card.type = 'button';
        card.className = 'block-card glass';
        if (currentEpisode && episodes.includes(currentEpisode)) card.classList.add('is-current');

        const segments = episodes.map(n => {
          const s = classifyEpisode(n);
          return `<span style="--c:${statusMeta[s.key].color}"></span>`;
        }).join('');

        const currentInfo = currentEpisode && episodes.includes(currentEpisode)
          ? `<span class="block-now">${eyeSVG} Ep. ${episodes.indexOf(currentEpisode) + 1}</span>`
          : `<span class="block-now"></span>`;

        card.innerHTML = `
          <div class="block-head">
            <div class="block-copy">
              <div class="block-name">${season.name}</div>
              <div class="block-meta">#${episodes[0]}–#${episodes[episodes.length - 1]} · ${episodes.length} ep.</div>
            </div>
            ${currentInfo}
          </div>
          <div class="status-strip" aria-hidden="true">${segments}</div>
        `;
        card.addEventListener('click', () => openBlock(index, true));
        blockList.appendChild(card);
      });
    }

    function openBlock(index, push = false, scrollEpisode = null) {
      openBlockIndex = index;
      const season = SEASONS[index];
      const episodes = buildEpisodeList(season);
      document.body.classList.add('detail-mode');
      detailTitle.textContent = season.name;
      detailRange.textContent = `#${episodes[0]}–#${episodes[episodes.length - 1]} · ${episodes.length} episodios`;
      renderEpisodes(index);
      homeView.classList.add('hide');
      detailView.classList.add('show');
      if (push) history.pushState({ block:index }, '', `#block-${index}`);
      requestAnimationFrame(() => {
        if (scrollEpisode) {
          document.querySelector(`[data-episode="${scrollEpisode}"]`)?.scrollIntoView({ behavior:'smooth', block:'center' });
        } else {
          window.scrollTo({ top:0, behavior:'smooth' });
        }
      });
    }

    function renderEpisodes(index) {
      const season = SEASONS[index];
      const episodes = buildEpisodeList(season);
      episodeList.innerHTML = '';

      episodes.forEach((n, localIndex) => {
        const info = classifyEpisode(n);
        const meta = statusMeta[info.key];
        const row = document.createElement('div');
        row.className = 'episode-row';
        row.dataset.episode = String(n);
        row.style.setProperty('--status', meta.color);
        if (currentEpisode === n) row.classList.add('is-current');

        row.innerHTML = `
          <div class="episode-copy">
            <div class="episode-line">
              <span class="episode-local">Episodio ${localIndex + 1}</span>
              <span class="episode-global">#${n}</span>
            </div>
            <div class="episode-status">${info.label}</div>
          </div>
          <button class="eye-button ${currentEpisode === n ? 'active' : ''}" aria-label="Marcar episodio ${localIndex + 1} como actual">${eyeSVG}</button>
        `;

        row.addEventListener('click', () => showEpisodeSheet(n, season, localIndex + 1));
        row.querySelector('.eye-button').addEventListener('click', (event) => {
          event.stopPropagation();
          setCurrentEpisode(n);
        });
        episodeList.appendChild(row);
      });
    }

    function setCurrentEpisode(n) {
      currentEpisode = n;
      localStorage.setItem('oneGuideCurrentEpisode', String(n));
      localStorage.setItem('oneGitCurrentEpisode', String(n));
      renderBlocks();
      if (openBlockIndex !== null) renderEpisodes(openBlockIndex);
      renderCurrent();
      showToast(`#${n} marcado`);
    }

    function renderCurrent() {
      if (!currentEpisode) {
        currentCard.classList.remove('show');
        currentDock.classList.remove('show');
        return;
      }

      const pos = getBlockForEpisode(currentEpisode);
      if (!pos) return;
      const info = classifyEpisode(currentEpisode);
      const meta = statusMeta[info.key];
      const sub = `${pos.season.name} · Episodio ${pos.local}`;

      currentCard.style.setProperty('--status', meta.color);
      currentCard.innerHTML = `
        <div class="current-eye">${eyeSVG}</div>
        <div class="current-main">
          <div class="current-top"><span class="current-number">#${currentEpisode}</span><span class="current-status">${info.label}</span></div>
          <div class="current-sub">${sub}</div>
        </div>
        ${chevronSVG}
      `;
      currentCard.classList.add('show');

      currentDock.style.setProperty('--status', meta.color);
      currentDock.innerHTML = `
        <div class="dock-icon">${eyeSVG}</div>
        <div class="dock-copy">
          <div class="dock-title">#${currentEpisode} · Episodio ${pos.local}</div>
          <div class="dock-sub">${pos.season.name}</div>
        </div>
        <div class="dock-status">${info.label}</div>
      `;
      currentDock.classList.add('show');
    }

    function goCurrent() {
      if (!currentEpisode) {
        showToast('Toca el ojo de un episodio');
        return;
      }
      const pos = getBlockForEpisode(currentEpisode);
      if (!pos) return;
      openBlock(pos.index, true, currentEpisode);
    }

    function showEpisodeSheet(n, season, local) {
      const info = classifyEpisode(n);
      const meta = statusMeta[info.key];
      sheetNumber.textContent = `${season.name} · Episodio ${local} · #${n}`;
      sheetStatus.textContent = info.full;
      sheetStatus.style.setProperty('--status', meta.color);
      sheetText.textContent = info.detail;
      sheetBackdrop.classList.add('show');
      sheetBackdrop.setAttribute('aria-hidden', 'false');
    }

    function closeSheet() {
      sheetBackdrop.classList.remove('show');
      sheetBackdrop.setAttribute('aria-hidden', 'true');
    }

    function showHome() {
      openBlockIndex = null;
      document.body.classList.remove('detail-mode');
      detailView.classList.remove('show');
      homeView.classList.remove('hide');
      window.scrollTo({ top:0, behavior:'smooth' });
    }

    function showToast(message) {
      clearTimeout(toastTimer);
      toast.textContent = message;
      toast.classList.add('show');
      toastTimer = setTimeout(() => toast.classList.remove('show'), 1450);
    }

    currentCard.addEventListener('click', goCurrent);
    currentCard.addEventListener('keydown', e => { if (e.key === 'Enter' || e.key === ' ') goCurrent(); });
    currentDock.addEventListener('click', goCurrent);
    currentDock.addEventListener('keydown', e => { if (e.key === 'Enter' || e.key === ' ') goCurrent(); });
    currentButton.addEventListener('click', goCurrent);
    backButton.addEventListener('click', () => history.back());
    sheetBackdrop.addEventListener('click', e => { if (e.target === sheetBackdrop) closeSheet(); });
    document.addEventListener('keydown', e => { if (e.key === 'Escape') closeSheet(); });

    window.addEventListener('popstate', () => {
      const match = location.hash.match(/^#block-(\d+)$/);
      if (match) {
        openBlock(Number(match[1]), false);
      } else {
        showHome();
      }
    });

    renderBlocks();
    renderCurrent();

    const initial = location.hash.match(/^#block-(\d+)$/);
    if (initial && SEASONS[Number(initial[1])]) openBlock(Number(initial[1]), false);
  </script>
</body>
</html>
